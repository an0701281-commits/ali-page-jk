* {

body {
    margin: 0;

    font-family: monospace;

.box {
    width: 100%;

    padding: 30px;

.links {

.links a {
    display: block;

    color: #00ff66;
    text-decoration: none;
    font-size: 17px;

    transition: 0.3s;
}

.links a:hover {
    background: #00ff66;
    color: #000;
    box-shadow: 0 0 25px #00ff66;
}

.cursor {
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% {

}
